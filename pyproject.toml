[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eng-graph"
version = "0.1.0"
description = "Engineering Continuity Graph — local MCP memory for engineering sessions"
authors = [{ name = "Mohd Aman", email = "mohdaman892@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
eng-server = "eng_graph.__main__:main"
eng = "eng_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
